[workspace]
name = "tsumo-mojo"
channels = ["conda-forge", "https://conda.modular.com/max-nightly/"]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.1.0.dev2026083005"
brotli = "==1.2.0"
c-compiler = "==2.0.0"
icu = "==78.3"
openssl = "==3.6.4"
quickjs = "==2025.09.13"
sysroot_linux-64 = "==2.34"
zlib = "==1.3.2"
python = ">=3.12,<3.15"

[pypi-dependencies]
linkify-it-py = "==2.0.3"
markdown-it-py = "==4.0.0"
mdit-py-plugins = "==0.5.0"
pillow = "==12.1.1"
quickjs = "==1.19.4"

[tasks]
format = "mojo format -l 100 mojo"
